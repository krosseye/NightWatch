[project]
name = "nightwatch"
version = "1.1.2"
description = "NightWatch helps create a sleep-friendly environment by managing your devices during bedtime."
readme = "readme.md"
authors = [
    { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = ["sv-ttk>=2.6.1"]

[project.scripts]
nightwatch = "nightwatch.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
build = ["pyinstaller>=6.22.3"]
dev = [
    "ruff>=0.17,<1.0.0",
    "mypy>=2.4,<3.0.0",
    "prek>=0.5.0,<1.0.0",
    "types-pyinstaller>=6.22.1.20260827",
]

[tool.uv]
default-groups = ["dev", "build"]

[tool.mypy]
files = ["src", "build.py"]
strict = true
